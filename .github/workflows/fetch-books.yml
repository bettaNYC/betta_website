name: Sync Goodreads Books

# Reads the public RSS feeds for Elisabetta's Goodreads shelves and writes
# books.json, which books.html renders. Goodreads has no API since 2020, so
# this uses the shelf RSS feeds — no secrets/tokens required.

on:
  workflow_dispatch:            # manual run from the Actions tab
  schedule:
    - cron: '0 7 * * 1'         # weekly — 07:00 UTC every Monday

jobs:
  sync-books:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Goodreads shelves
        run: python3 fetch-books.py

      - name: Commit updated books
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add books.json
          git diff --staged --quiet || git commit -m "Sync Goodreads books"
          git push
